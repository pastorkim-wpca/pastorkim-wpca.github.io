<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<!-- 성도 사진이 담긴 페이지 — 검색엔진 색인 금지(2026-08-04 목사님 지시).
     링크를 아는 사람만 보게 하는 것이 목적. robots.txt 의 Disallow 와 함께 동작. -->
<meta name="robots" content="noindex,nofollow,noarchive,noimageindex">
<meta name="googlebot" content="noindex,nofollow,noimageindex">
<meta name="referrer" content="no-referrer">
<title>새가족 환영과 축복 기도 · 미주서부장로교회 사진첩</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#f5f5f7;--ink:#1d1d1f;--sub:#6e6e73;--accent:#8B4C2F}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",
    "Segoe UI",Roboto,"Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5}
  header{text-align:center;padding:56px 20px 28px}
  header .kicker{font-size:14px;letter-spacing:.06em;color:var(--sub);font-weight:600}
  header h1{font-size:clamp(28px,6vw,44px);font-weight:800;letter-spacing:-.02em;margin:8px 0 6px}
  header .meta{font-size:15px;color:var(--sub)}
  header .rule{width:44px;height:4px;border-radius:2px;background:var(--accent);margin:20px auto 0;opacity:.85}
  .grid{max-width:1200px;margin:0 auto;padding:8px 14px 60px;
    display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
  @media(max-width:560px){.grid{grid-template-columns:repeat(2,1fr);gap:7px;padding:8px 10px 48px}}
  .tile{position:relative;display:block;aspect-ratio:4/3;overflow:hidden;border-radius:14px;
    background:#e9e9ec;box-shadow:0 1px 3px rgba(0,0,0,.06);cursor:zoom-in;-webkit-tap-highlight-color:transparent}
  .tile img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .45s cubic-bezier(.2,.7,.2,1)}
  .tile:hover img{transform:scale(1.06)}
  .cell{margin:0;display:flex;flex-direction:column;gap:7px}
  .cell .cap{font-size:14px;line-height:1.45;color:var(--ink);font-weight:600;
    padding:0 2px}
  @media(max-width:560px){.cell .cap{font-size:12.5px}}
  .lb .cap{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));left:0;right:0;
    text-align:center;color:#fff;font-size:16px;font-weight:600;line-height:1.5;
    padding:0 24px;text-shadow:0 1px 4px rgba(0,0,0,.7)}
  @media(max-width:560px){.lb .cap{font-size:14px}}
  footer{text-align:center;padding:0 20px 60px;color:var(--sub);font-size:14px}
  footer a{color:var(--accent);text-decoration:none;font-weight:600}
  .lb{position:fixed;inset:0;background:rgba(0,0,0,.94);display:none;z-index:99;
    align-items:center;justify-content:center;touch-action:pan-y;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  .lb.open{display:flex}
  .lb img{max-width:96vw;max-height:88vh;object-fit:contain;border-radius:6px;
    box-shadow:0 12px 50px rgba(0,0,0,.5);user-select:none;-webkit-user-drag:none}
  .lb .count{position:absolute;top:calc(16px + env(safe-area-inset-top));left:0;right:0;
    text-align:center;color:#fff;font-size:14px;font-weight:600;opacity:.85}
  .lb button{position:absolute;background:rgba(255,255,255,.12);border:0;color:#fff;
    width:50px;height:50px;border-radius:50%;font-size:24px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:background .2s;-webkit-tap-highlight-color:transparent}
  .lb button:hover{background:rgba(255,255,255,.25)}
  .lb .close{top:calc(12px + env(safe-area-inset-top));right:14px;width:44px;height:44px;font-size:22px}
  .lb .prev{left:14px;top:50%;transform:translateY(-50%)}
  .lb .next{right:14px;top:50%;transform:translateY(-50%)}
  @media(max-width:560px){.lb .prev,.lb .next{width:42px;height:42px;font-size:20px}
    .lb img{max-width:100vw;max-height:82vh}}
</style>
</head>
<body>
  <header>
    <div class="kicker">미주서부장로교회 · 사진첩</div>
    <h1>새가족 환영과 축복 기도</h1>
    <div class="meta">사진 4장 · 눌러서 크게 보기</div>
    <div class="rule"></div>
  </header>
  <main class="grid" id="grid">
      <figure class="cell"><a class="tile" href="full/001.jpg" data-i="0" aria-label="사진 1"><img loading="lazy" src="thumb/001.jpg" alt="새가족 환영 — 장덕출 집사님 · 장윤숙 권사님"></a><figcaption class="cap">새가족 환영 — 장덕출 집사님 · 장윤숙 권사님</figcaption></figure>
      <figure class="cell"><a class="tile" href="full/002.jpg" data-i="1" aria-label="사진 2"><img loading="lazy" src="thumb/002.jpg" alt="교회소식 — 송우리 청년을 소개합니다"></a><figcaption class="cap">교회소식 — 송우리 청년을 소개합니다</figcaption></figure>
      <figure class="cell"><a class="tile" href="full/003.jpg" data-i="2" aria-label="사진 3"><img loading="lazy" src="thumb/003.jpg" alt="축복 기도 — 온 교회가 손을 얹어 송우리 청년을 위해 기도합니다"></a><figcaption class="cap">축복 기도 — 온 교회가 손을 얹어 송우리 청년을 위해 기도합니다</figcaption></figure>
      <figure class="cell"><a class="tile" href="full/004.jpg" data-i="3" aria-label="사진 4"><img loading="lazy" src="thumb/004.jpg" alt="송우리 청년을 위한 축복"></a><figcaption class="cap">송우리 청년을 위한 축복</figcaption></figure>
  </main>
  <footer>
    © 미주서부장로교회 West Presbyterian Church of America<br>
    <a href="https://wpca.org/photos/">← 사진 페이지로 돌아가기</a>
  </footer>
  <div class="lb" id="lb" aria-modal="true" role="dialog">
    <div class="count" id="count"></div>
    <button class="close" id="close" aria-label="닫기">✕</button>
    <button class="prev" id="prev" aria-label="이전">‹</button>
    <img id="lbimg" src="" alt="">
    <button class="next" id="next" aria-label="다음">›</button>
    <div class="cap" id="lbcap"></div>
  </div>
<script>
  const FULL=["001.jpg","002.jpg","003.jpg","004.jpg"];
  const CAPS=["새가족 환영 — 장덕출 집사님 · 장윤숙 권사님","교회소식 — 송우리 청년을 소개합니다","축복 기도 — 온 교회가 손을 얹어 송우리 청년을 위해 기도합니다","송우리 청년을 위한 축복"];
  const lb=document.getElementById('lb'),img=document.getElementById('lbimg'),count=document.getElementById('count');
  const lbcap=document.getElementById('lbcap');
  let cur=0;
  function show(i){cur=(i+FULL.length)%FULL.length;img.src='full/'+FULL[cur];count.textContent=(cur+1)+' / '+FULL.length;
    var c=(CAPS[cur]||'');lbcap.textContent=c;lbcap.style.display=c?'block':'none';}
  function open(i){show(i);lb.classList.add('open');document.body.style.overflow='hidden';}
  function close(){lb.classList.remove('open');img.src='';document.body.style.overflow='';}
  document.getElementById('grid').addEventListener('click',e=>{const a=e.target.closest('.tile');if(!a)return;e.preventDefault();open(+a.dataset.i);});
  document.getElementById('close').onclick=close;
  document.getElementById('prev').onclick=e=>{e.stopPropagation();show(cur-1);};
  document.getElementById('next').onclick=e=>{e.stopPropagation();show(cur+1);};
  lb.addEventListener('click',e=>{if(e.target===lb)close();});
  document.addEventListener('keydown',e=>{if(!lb.classList.contains('open'))return;
    if(e.key==='Escape')close();else if(e.key==='ArrowLeft')show(cur-1);else if(e.key==='ArrowRight')show(cur+1);});
  let x0=null;
  lb.addEventListener('touchstart',e=>x0=e.touches[0].clientX,{passive:true});
  lb.addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;
    if(Math.abs(dx)>50)show(dx<0?cur+1:cur-1);x0=null;},{passive:true});
</script>
</body>
</html>
